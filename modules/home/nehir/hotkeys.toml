# Niri Mod ≈ Command. Bare Cmd+* that fights AppKit (Hide, Find, Preferences,
# Reload, etc.) is owned by skhd → nehirctl. Leave those Unassigned here so
# Carbon and skhd do not double-fire. Cmd+Space stays Spotlight.
# Cmd+C/V/W/Q left to apps (Copy/Paste/Close/Quit).

[workspace]
switch = "Unassigned"
moveTo = "Unassigned"
moveColumnTo = "Unassigned"
focusAnywhere = "Unassigned"
backAndForth = "Unassigned"
next = "Unassigned"
previous = "Unassigned"
swapWithMonitorLeft = "Unassigned"
swapWithMonitorRight = "Unassigned"
swapWithMonitorUp = "Unassigned"
swapWithMonitorDown = "Unassigned"
# Column → adjacent monitor: Cmd+Shift+Ctrl+HJKL via skhd (niri Mod+Shift+Ctrl+*).

[focus]
column = "Unassigned"
windowInColumn = "Unassigned"
left = "Unassigned"
down = "Unassigned"
up = "Unassigned"
right = "Unassigned"
previous = "Unassigned"
downOrLeft = "Unassigned"
upOrRight = "Unassigned"
windowTop = "Unassigned"
windowBottom = "Unassigned"
windowDownOrTop = "Unassigned"
windowUpOrBottom = "Unassigned"
windowOrWorkspaceDown = "Unassigned"
windowOrWorkspaceUp = "Unassigned"
columnFirst = "Unassigned"
columnLast = "Unassigned"
monitorNext = "Option+Shift+Command+L"
monitorPrevious = "Option+Shift+Command+H"
monitorLast = "Unassigned"

[move]
columnToIndex = "Unassigned"
left = "Unassigned"
down = "Unassigned"
up = "Unassigned"
right = "Unassigned"
windowDown = "Unassigned"
windowUp = "Unassigned"
windowDownOrToWorkspaceDown = "Unassigned"
windowUpOrToWorkspaceUp = "Unassigned"
windowToWorkspaceUp = "Unassigned"
windowToWorkspaceDown = "Unassigned"
columnToWorkspaceUp = "Unassigned"
columnToWorkspaceDown = "Unassigned"
columnLeft = "Unassigned"
columnRight = "Unassigned"
columnToFirst = "Unassigned"
columnToLast = "Unassigned"
consumeOrExpelLeft = "Unassigned"
consumeOrExpelRight = "Unassigned"
consumeIntoColumn = "Unassigned"
expelFromColumn = "Unassigned"

[layout]
# Cmd+F / Cmd+Shift+F / Cmd+Ctrl+F / Cmd+R / etc. via skhd (niri Mod+*).
toggleFullscreen = "Unassigned"
toggleNativeFullscreen = "Unassigned"
# Mod+W is close-tab on macOS — keep tabbed off Cmd+W.
toggleColumnTabbed = "Option+Shift+Command+T"
toggleColumnFullWidth = "Unassigned"
expandColumnToAvailable = "Unassigned"
cycleColumnWidthForward = "Unassigned"
cycleColumnWidthBackward = "Unassigned"
cycleWindowWidthForward = "Unassigned"
cycleWindowWidthBackward = "Unassigned"
cycleWindowHeightForward = "Unassigned"
cycleWindowHeightBackward = "Unassigned"
decreaseColumnWidth = "Unassigned"
increaseColumnWidth = "Unassigned"
decreaseWindowWidth = "Unassigned"
increaseWindowWidth = "Unassigned"
decreaseWindowHeight = "Unassigned"
increaseWindowHeight = "Unassigned"
resetWindowHeight = "Unassigned"
balanceSizes = "Unassigned"
scrollViewportLeft = "Unassigned"
scrollViewportRight = "Unassigned"
# Cmd+V is Paste — use Cmd+Shift+V via skhd (niri Mod+V).
toggleFocusedFloating = "Unassigned"
assignScratchpad = "Unassigned"
toggleScratchpad = "Unassigned"
raiseAllFloating = "Unassigned"
rescueOffscreen = "Unassigned"

[ui]
commandPalette = "Unassigned"
menuAnywhere = "Unassigned"
settings = "Unassigned"
toggleOverview = "Unassigned"
toggleWorkspaceBar = "Unassigned"
toggleFocusFollowsMouse = "Unassigned"
toggleFocusFollowsWindowToMonitor = "Unassigned"
toggleMoveMouseToFocused = "Unassigned"
toggleBordersEnabled = "Unassigned"
togglePreventSleepEnabled = "Unassigned"
toggleIPCEnabled = "Unassigned"

[debugging]
dumpRuntimeState = "Unassigned"
resetRuntimeState = "Unassigned"
restartClearingRuntimeState = "Unassigned"
toggleTraceCapture = "Unassigned"
